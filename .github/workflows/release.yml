name: Release standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-13
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[research]" pyinstaller==6.16.0
      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm packaging/tradingalgo.spec
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/tradingalgo.exe "dist/tradingalgo-${{ matrix.platform }}.exe"
          else
            mv dist/tradingalgo "dist/tradingalgo-${{ matrix.platform }}"
            chmod +x "dist/tradingalgo-${{ matrix.platform }}"
          fi
      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/tradingalgo-${{ matrix.platform }}.exe --help
            ./dist/tradingalgo-${{ matrix.platform }}.exe web --help
          else
            ./dist/tradingalgo-${{ matrix.platform }} --help
            ./dist/tradingalgo-${{ matrix.platform }} web --help
          fi
      - name: Build user bundle and checksum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          platform = "${{ matrix.platform }}"
          dist = Path("dist")
          binary = next(dist.glob(f"tradingalgo-{platform}*"))
          bundle = dist / f"tradingalgo-{platform}.zip"
          quickstart = Path("packaging/QUICKSTART.md")
          checksum = hashlib.sha256(binary.read_bytes()).hexdigest()
          checksum_file = dist / f"tradingalgo-{platform}.sha256"
          checksum_file.write_text(f"{checksum}  {binary.name}\n", encoding="utf-8")
          with zipfile.ZipFile(bundle, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(binary, binary.name)
              archive.write(quickstart, "QUICKSTART.md")
              archive.write(checksum_file, checksum_file.name)
          print(bundle)
          PY
      - name: Upload downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: tradingalgo-${{ matrix.platform }}
          path: |
            dist/tradingalgo-${{ matrix.platform }}.zip
            dist/tradingalgo-${{ matrix.platform }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: tradingalgo-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
