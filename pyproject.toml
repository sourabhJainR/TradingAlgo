[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingalgo"
version = "0.2.1"
description = "Investment intelligence and advisory platform with isolated trading infrastructure"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
research = [
  "duckdb>=1.1,<2",
  "polars>=1.0,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2",
]

[project.scripts]
tradingalgo = "tradingalgo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/tradingalgo/core/events.py" = ["F401"]
"src/tradingalgo/execution/broker.py" = ["F401"]
"src/tradingalgo/intelligence/analytics_history.py" = ["F401"]
"src/tradingalgo/intelligence/factor_engine.py" = ["F401", "F841"]
"src/tradingalgo/intelligence/ipo_analysis.py" = ["E701", "E702"]
"src/tradingalgo/intelligence/market_context.py" = ["F401"]
"src/tradingalgo/intelligence/normalizers.py" = ["E701"]
"src/tradingalgo/intelligence/technical.py" = ["E701", "E702", "E741"]
"src/tradingalgo/intelligence/technical_signals.py" = ["E701", "E702"]
"src/tradingalgo/risk/engine.py" = ["F401"]
"src/tradingalgo/storage.py" = ["E701"]
"src/tradingalgo/web/research_service.py" = ["E741"]
"tests/test_batch14_outcomes_stats.py" = ["E702"]
"tests/test_orchestration_batch8.py" = ["E701"]

[tool.mypy]
python_version = "3.11"
strict = true
