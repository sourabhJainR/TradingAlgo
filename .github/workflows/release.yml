name: Release standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tradingalgo-linux-x64
          - os: windows-latest
            artifact: tradingalgo-windows-x64.exe
          - os: macos-latest
            artifact: tradingalgo-macos-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.16.0
      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm packaging/tradingalgo.spec
      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/tradingalgo.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/tradingalgo "dist/${{ matrix.artifact }}"
          fi
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.artifact }} --help
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**/*
